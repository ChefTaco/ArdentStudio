version: 2
updates:
  # Suite packages: one grouped weekly pull request for every @hivemagnus/* update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "@hivemagnus/*"
    groups:
      hivemagnus:
        patterns:
          - "@hivemagnus/*"
